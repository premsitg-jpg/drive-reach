*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,system-ui,sans-serif;overflow-x:clip}

.stepper button:disabled{opacity:.35;cursor:default}
.stepper button:focus-visible,.pre button:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.tv{padding:0 16px;text-align:center;min-width:150px}
.tv input{width:84px;font:600 34px Kanit,sans-serif;text-align:right;border:0;background:none;color:var(--ink);-moz-appearance:textfield}
.tv input::-webkit-inner-spin-button{display:none}
.tv span{font:600 20px Kanit,sans-serif}
.pre{display:flex;flex-wrap:wrap;gap:8px}

.wrap{max-width:1240px;margin:auto;padding:10px max(5vw,16px) 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.mapbox{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.fig{position:relative;aspect-ratio:0.62}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);padding:6px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.cards{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font:600 17px Kanit,sans-serif}
.ch .arrow{font-size:22px;line-height:1}
.ch .end{margin-inline-start:auto;font:400 13px Sarabun,sans-serif;opacity:.9}
.cb{padding:14px 16px 12px}
.place{font-size:clamp(24px,3vw,30px)}
.meta{color:var(--mut);font-size:14px;margin:4px 0 10px;white-space:normal}
.meta b{color:var(--ink);white-space:nowrap}

.spots li{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--sign2)}

.next{font-size:14px;color:var(--mut)}
.tl{display:flex;gap:0;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.tl div{flex:1 0 64px;font-size:12px;color:var(--mut);text-align:center;position:relative;padding-top:16px;line-height:1.3}
.tl div::before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:var(--line)}
.tl div::after{content:"";position:absolute;top:1px;left:calc(50% - 5px);width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tl div.on::before{background:var(--c)}.tl div.on::after{background:var(--c);border-color:var(--c)}
.tl div.cur{color:var(--ink);font-weight:600}.tl div.cur::after{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.none{color:var(--mut)}
footer{max-width:1240px;margin:auto;padding:0 max(5vw,16px) 40px;font-size:13px;color:var(--mut)}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.mapbox{position:static}.fig{aspect-ratio:0.75;max-height:70vh;margin:auto}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s ease-out infinite}@keyframes p{0%{r:6;opacity:.7}100%{r:18;opacity:0}}}
</style>

}

function drawMap(){
  const svg=$('map'),W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const sx=(LO1-LO0)*CX,sy=LA1-LA0,k=Math.min(W/sx,H/sy),ox=(W-sx*k)/2,oy=(H-sy*k)/2;
  const P=(lng,lat)=>[(ox+(lng-LO0)*CX*k).toFixed(1),(oy+(LA1-lat)*k).toFixed(1)];
  const st=P(START.lng,START.lat);
  let h='<path d="M'+TH.map(p=>P(p[0],p[1]).join(',')).join('L')+'Z" fill="var(--land)" stroke="var(--coast)" stroke-width="1.2" stroke-linejoin="round"/>';
  const small=W<360;
  R.forEach(r=>{
    const {cur}=reach(r);const ci=cur?r.s.indexOf(cur):-1;
    const pts=[st].concat(r.s.map(s=>P(s[4],s[3])));
    h+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+r.c+'" stroke-width="1.5" stroke-opacity=".35" stroke-dasharray="3 3"/>';
    if(ci>=0)h+='<polyline points="'+pts.slice(0,ci+2).map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+r.c+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';
    r.s.forEach((s,i)=>{const p=P(s[4],s[3]);h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i<=ci?3.2:2.4)+'" fill="'+(i<=ci?r.c:'var(--card)')+'" stroke="'+r.c+'" stroke-width="1.2"/>'});
    if(cur){const p=P(cur[4],cur[3]);
      h+='<circle class="pulse" cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="'+r.c+'" opacity=".5"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="6.5" fill="'+r.c+'" stroke="#fff" stroke-width="2"/>';
      const left=cur[4]>101.6||(r.k==='s'&&cur[3]<9.5&&cur[4]>100.3);
      const lx=+p[0]+(left?-10:10),fs=small?11:13;
      h+='<text x="'+lx+'" y="'+(+p[1]+4)+'" font-size="'+fs+'" font-weight="600" text-anchor="'+(left?'end':'start')+'" fill="var(--ink)" stroke="var(--card)" stroke-width="3.5" paint-order="stroke" font-family="Sarabun,sans-serif">'+esc(cur[0])+'</text>';}
  });
  h+='<rect x="'+(st[0]-6)+'" y="'+(st[1]-6)+'" width="12" height="12" rx="2" fill="var(--yel)" stroke="#111" stroke-width="1.5" transform="rotate(45 '+st[0]+' '+st[1]+')"/>';
  svg.innerHTML=h;
}

function render(){
  $('hrs').value=T;$('minus').disabled=T<=0.5;$('plus').disabled=T>=17;
  $('pre').innerHTML=PRE.map(p=>'<button data-h="'+p+'" aria-pressed="'+(p===T)+'">'+p+' ชม.</button>').join('');
  $('cards').innerHTML=R.map(r=>{
    const {cur,next,done}=reach(r);
    let body;
    if(!cur){body='<div class="place none">ยังไม่ออกนอกกรุงเทพฯ</div><div class="meta">จุดแรกของสายนี้: <b>'+esc(r.s[0][0])+'</b> ~'+fmtH(r.s[0][1])+'</div>';}
    else{
      body='<div class="place">'+esc(cur[0])+(done?'<span class="tag">ถึงปลายทางแล้ว</span>':'')+'</div>'+
      '<div class="meta">ขับ ~<b>'+fmtH(cur[1])+'</b> · ~<b>'+cur[2].toLocaleString()+' km</b></div>'+
      '<ul class="spots">'+cur[5].split('|').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
      '<div class="row"><a class="nav" href="'+gmaps(cur)+'" target="_blank" rel="noopener">นำทาง ↗</a>'+
      (next?'<span class="next">ถัดไป: '+esc(next[0])+' อีก ~'+fmtH(next[1]-cur[1])+'</span>':'')+'</div>';
    }
    const ci=cur?r.s.indexOf(cur):-1;
    const tl='<div class="tl" style="--c:'+r.c+'">'+r.s.map((s,i)=>'<div class="'+(i<=ci?'on':'')+(i===ci?' cur':'')+'">'+esc(s[0].split(' ')[0])+'<br>'+s[1]+' ชม.</div>').join('')+'</div>';
    return '<article class="card"><div class="ch" style="background:'+r.c+'"><span class="arrow">'+r.arrow+'</span>'+r.name+'<span class="end">ปลายทาง '+esc(r.end)+' ~'+fmtH(r.s[r.s.length-1][1])+'</span></div><div class="cb">'+body+tl+'</div></article>';
  }).join('');
  $('legend').innerHTML=R.map(r=>'<span><i style="background:'+r.c+'"></i>'+r.name+'</span>').join('')+'<span><i style="background:var(--yel);transform:rotate(45deg)"></i>KOKO PLACE</span>';
  drawMap();
  try{localStorage.setItem('reachT',T)}catch(e){}
}
function setT(v){v=Math.round(v*2)/2;if(isNaN(v))return;T=Math.min(17,Math.max(0.5,v));render()}
$('minus').addEventListener('click',()=>setT(T-0.5));
$('plus').addEventListener('click',()=>setT(T+0.5));
$('hrs').addEventListener('change',e=>setT(parseFloat(e.target.value)));
$('pre').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setT(+b.dataset.h)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowUp'||e.key==='+')setT(T+0.5);if(e.key==='ArrowDown'||e.key==='-')setT(T-0.5)});
const ro=new ResizeObserver(drawMap);ro.observe($('map'));
render();
}
</script>
</body>
</html>
