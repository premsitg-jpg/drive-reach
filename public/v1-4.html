<style>
/* VOICE: practical road-trip tool, friendly but exact
   IDEA: Thai highway direction signs — blue boards, white letters, yellow road marking
   PICTURE: drawn map of Thailand, every province dot coloured by สาย, the ones at the chosen time lit up
   COLOUR and TYPE: sign blue + white, accent road-yellow; Kanit titles, Sarabun body
   LAYOUT: sign-strip header, big −/+ time control + search, map beside 5 route cards; stacks on phone */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fa,#0b1020);--ink:light-dark(#121826,#eef2fb);--mut:light-dark(#5b6476,#9aa5bd);
--card:light-dark(#fff,#141b2e);--line:light-dark(#dde3ee,#26304a);--sign:#0b4ea2;--sign2:light-dark(#e8f0fb,#132546);
--yel:#f5c400;--land:light-dark(#e3e9f2,#1a2238);--coast:light-dark(#b9c4d6,#36425f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,system-ui,sans-serif;overflow-x:clip}
h1,.big{font-family:Kanit,Sarabun,sans-serif;font-weight:600;line-height:1.1;margin:0}
header{background:var(--sign);color:#fff;padding:14px max(5vw,16px);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-bottom:5px solid var(--yel)}
header h1{font-size:clamp(22px,3.4vw,32px)}
.ver{font:600 12px Sarabun,sans-serif;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px}
.from{margin-inline-start:auto;font-size:14px;opacity:.92}
.ctl{padding:18px max(5vw,16px) 6px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;max-width:1240px;margin:auto}
.stepper{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stepper button{width:56px;height:60px;border:0;background:var(--sign);color:#fff;font:600 30px Kanit,sans-serif;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.tv{padding:0 16px;text-align:center;min-width:150px}
.tv input{width:84px;font:600 34px Kanit,sans-serif;text-align:right;border:0;background:none;color:var(--ink);-moz-appearance:textfield}
.tv input::-webkit-inner-spin-button{display:none}
.tv span{font:600 20px Kanit,sans-serif}
.pre{display:flex;flex-wrap:wrap;gap:8px}
.pre button{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Sarabun,sans-serif;cursor:pointer}
.pre button[aria-pressed=true]{background:var(--yel);border-color:var(--yel);color:#111}
.search{max-width:1240px;margin:auto;padding:8px max(5vw,16px) 0}
.search input{width:100%;max-width:520px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Sarabun,sans-serif}
#res{display:grid;gap:10px;margin-top:10px;max-width:760px}
.summary{max-width:1240px;margin:auto;padding:8px max(5vw,16px) 0;color:var(--mut);font-size:14px}
.summary b{color:var(--ink)}
.wrap{max-width:1240px;margin:auto;padding:10px max(5vw,16px) 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.mapbox{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.fig{position:relative;aspect-ratio:0.62}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);padding:6px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.cards{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 16px;color:#fff;font:600 17px Kanit,sans-serif}
.ch .arrow{font-size:22px;line-height:1}
.ch .end{margin-inline-start:auto;font:400 13px Sarabun,sans-serif;opacity:.92}
.cb{padding:6px 16px 14px}
.hit{padding:12px 0;border-bottom:1px solid var(--line)}.hit:last-child{border-bottom:0}
.hn{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.place{font:600 clamp(20px,2.6vw,25px)/1.15 Kanit,Sarabun,sans-serif}
.kind{font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.meta{color:var(--mut);font-size:14px;margin:2px 0 8px}
.meta b{color:var(--ink);white-space:nowrap}
.tag{display:inline-block;font:600 12px Sarabun,sans-serif;padding:2px 8px;border-radius:6px;background:var(--yel);color:#111}
.spots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.spots a{display:inline-flex;align-items:center;min-height:36px;font-size:14px;padding:4px 10px;border-radius:8px;background:var(--sign2);color:var(--ink);text-decoration:none}
.spots a::after{content:"↗";margin-inline-start:6px;color:var(--sign);font-weight:600}
.nav{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--sign);color:#fff;text-decoration:none;font-weight:600}
.near{font-size:14px;color:var(--mut);padding:10px 0 0}
.near b{color:var(--ink)}
.tl{position:relative;display:flex;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tl div{flex:0 0 74px;font-size:12px;color:var(--mut);text-align:center;position:relative;padding-top:18px;line-height:1.3}
.tl div::before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:var(--line)}
.tl div:first-child::before{left:50%}.tl div:last-child::before{right:50%}
.tl div::after{content:"";position:absolute;top:1px;left:calc(50% - 6px);width:13px;height:13px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tl div.on::before{background:var(--c)}.tl div.on::after{background:var(--c);border-color:var(--c)}
.tl div.cur{color:var(--ink);font-weight:600}.tl div.cur::after{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.rd{display:inline-block;font:600 13px Sarabun,sans-serif;padding:1px 8px;border-radius:5px;background:#fff;color:#0b4ea2;border:1.5px solid #0b4ea2}
.rd.r1{color:#c62f28;border-color:#c62f28}
.ch .rd{border-color:#fff}
.tlg{margin-top:12px}
.tlg .tl{margin-top:4px}
.count{font-size:13px;color:var(--mut);padding-top:8px;border-top:1px dashed var(--line);margin-top:6px}
footer{max-width:1240px;margin:auto;padding:0 max(5vw,16px) 40px;font-size:13px;color:var(--mut)}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.mapbox{position:static}.fig{aspect-ratio:0.72;max-height:72vh;margin:auto}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s ease-out infinite}@keyframes p{0%{r:6;opacity:.7}100%{r:16;opacity:0}}}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtH=h=>{const m=Math.round(h*60),H=Math.floor(m/60),M=m%60;return (H?H+' ชม.':'')+(M?(H?' ':'')+M+' นาที':'')||'0 นาที'};
const ORI=START.lat+','+START.lng;
const navC=s=>'https://www.google.com/maps/dir/?api=1&origin='+ORI+'&destination='+s[3]+','+s[4]+'&travelmode=driving';
const area=s=>s[0].replace(/\s*\(.*?\)/g,'').split(' / ')[0];
const navQ=(spot,s)=>{const q=spot.replace(/\s*\(.*?\)/g,'')+' '+area(s);return 'https://www.google.com/maps/dir/?api=1&origin='+ORI+'&destination='+encodeURIComponent(q)+'&travelmode=driving'};
R.forEach(r=>{r.s.sort((a,b)=>a[1]-b[1]);r.max=r.s[r.s.length-1][1]});
const ALL=R.flatMap(r=>r.s.map(s=>({r,s})));
const NPROV=ALL.filter(x=>x.s[7]).length;
let T=3;
try{const v=parseFloat(localStorage.getItem('reachT'));if(v>=0.5&&v<=17)T=v}catch(e){}
const inWin=s=>Math.abs(s[1]-T)<=0.25;

function hitHTML(s,r,showDir){
  return '<div class="hit"><div class="hn"><span class="place">'+esc(s[0])+'</span><span class="kind">'+(s[7]?'จังหวัด':'จุดแวะ')+'</span>'+
   (showDir?'<span class="tag" style="background:'+r.c+';color:#fff">'+r.name+'</span>':'')+
   (s[1]>=r.max?'<span class="tag">ปลายทางสาย</span>':'')+'</div>'+
   '<div class="meta">ขับ ~<b>'+fmtH(s[1])+'</b> · ~<b>'+s[2].toLocaleString()+' km</b></div>'+
   '<ul class="spots">'+s[5].split('|').map(x=>'<li><a href="'+navQ(x,s)+'" target="_blank" rel="noopener">'+esc(x)+'</a></li>').join('')+'</ul>'+
   '<a class="nav" href="'+navC(s)+'" target="_blank" rel="noopener">นำทางไปตัวเมือง ↗</a></div>';
}

function drawMap(){
  const svg=$('map'),W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const sx=(LO1-LO0)*CX,sy=LA1-LA0,k=Math.min(W/sx,H/sy),ox=(W-sx*k)/2,oy=(H-sy*k)/2;
  const P=(lng,lat)=>[+(ox+(lng-LO0)*CX*k).toFixed(1),+(oy+(LA1-lat)*k).toFixed(1)];
  const st=P(START.lng,START.lat);
  let h='<path d="M'+TH.map(p=>P(p[0],p[1]).join(',')).join('L')+'Z" fill="var(--land)" stroke="var(--coast)" stroke-width="1.2" stroke-linejoin="round"/>';
  let shields='';
  const segs={},shown=new Set();
  ALL.filter(x=>inWin(x.s)).forEach(({s})=>pathTo(s).forEach(g=>{segs[g.n+'|'+g.pts.join(';')]=g}));
  Object.values(segs).forEach(({n,c,pts})=>{
    const q=pts.map(p=>P(p[0],p[1]));
    if(!c){h+='<polyline points="'+q.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="var(--mut)" stroke-width="1.6" stroke-dasharray="4 3"/>';return}
    h+='<polyline points="'+q.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+RC[c]+'" stroke-width="'+RW[c]+'" stroke-opacity=".7" stroke-linecap="round" stroke-linejoin="round"/>';
    if(!shown.has(n)){shown.add(n);const a=q[Math.floor((q.length-1)/2)],b=q[Math.ceil((q.length-1)/2)],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,w=n.length*6.5+8;
      shields+='<g><rect x="'+(mx-w/2)+'" y="'+(my-7.5)+'" width="'+w+'" height="15" rx="3" fill="'+(c===1?'#c62f28':c===2?'#0b4ea2':'#2f7d46')+'" stroke="#fff" stroke-width="1"/><text x="'+mx+'" y="'+(my+4)+'" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff" font-family="Sarabun,sans-serif">'+n+'</text></g>';}
  });
  let top='',labels=[];
  ALL.forEach(({r,s})=>{
    const p=P(s[4],s[3]),w=inWin(s),done=s[1]<=T;
    if(w){top+='<circle class="pulse" cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="'+r.c+'" opacity=".5"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="'+r.c+'" stroke="#fff" stroke-width="2"/>';labels.push({p,s})}
    else h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(done?3.2:2.6)+'" fill="'+(done?r.c:'var(--card)')+'" stroke="'+r.c+'" stroke-width="1.2" opacity="'+(done?.85:.7)+'"/>';
  });
  const fs=W<360?10.5:12.5,used=[];
  labels.forEach(({p,s})=>{
    const right=p[0]<W*0.62,y=p[1]+4;let yy=y;
    while(used.some(u=>Math.abs(u.y-yy)<fs+1&&Math.abs(u.x-p[0])<90))yy+=fs+1;
    used.push({x:p[0],y:yy});
    top+='<text x="'+(p[0]+(right?9:-9))+'" y="'+yy+'" font-size="'+fs+'" font-weight="600" text-anchor="'+(right?'start':'end')+'" fill="var(--ink)" stroke="var(--card)" stroke-width="3.5" paint-order="stroke" font-family="Sarabun,sans-serif">'+esc(area(s))+'</text>';
  });
  h+=shields+top+'<rect x="'+(st[0]-6)+'" y="'+(st[1]-6)+'" width="12" height="12" rx="2" fill="var(--yel)" stroke="#111" stroke-width="1.5" transform="rotate(45 '+st[0]+' '+st[1]+')"/>';
  svg.innerHTML=h;
}

function render(){
  $('hrs').value=T;$('minus').disabled=T<=0.5;$('plus').disabled=T>=17;
  $('pre').innerHTML=PRE.map(p=>'<button data-h="'+p+'" aria-pressed="'+(p===T)+'">'+p+' ชม.</button>').join('');
  const nWin=ALL.filter(x=>inWin(x.s)).length,nProvDone=ALL.filter(x=>x.s[7]&&x.s[1]<=T+0.25).length;
  $('sum').innerHTML='ขับ <b>'+fmtH(T)+'</b> (± 15 นาที) ถึง <b>'+nWin+'</b> จุด · ไปถึงแล้วรวม <b>'+nProvDone+' / '+NPROV+'</b> จังหวัด';
  $('cards').innerHTML=R.map(r=>{
    const hits=r.s.filter(inWin);
    let body;
    if(hits.length)body=hits.map(s=>hitHTML(s,r,false)).join('');
    else if(T>r.max)body='<div class="near">เลยปลายทางแล้ว — <b>'+esc(r.end)+'</b> ใช้ ~'+fmtH(r.max)+'</div>'+hitHTML(r.s[r.s.length-1],r,false);
    else{
      const prev=[...r.s].reverse().find(s=>s[1]<T),next=r.s.find(s=>s[1]>T);
      body='<div class="near">ไม่มีจุดตรงเวลานี้ · '+(prev?'ก่อนหน้า <b>'+esc(prev[0])+'</b> ~'+fmtH(prev[1]):'ยังไม่ออกนอกกรุงเทพฯ')+(next?' · ถัดไป <b>'+esc(next[0])+'</b> ~'+fmtH(next[1]):'')+'</div>';
    }
    const done=r.s.filter(s=>s[1]<=T+0.25).length;
    const tl='<div class="tl" style="--c:'+r.c+'">'+r.s.map((s,i)=>'<div class="'+(i<done?'on':'')+(inWin(s)||(!hits.length&&i===done-1)?' cur':'')+'">'+esc(area(s))+'<br>'+s[1]+' ชม.</div>').join('')+'</div>';
    return '<article class="card"><div class="ch" style="background:'+r.c+'"><span class="arrow">'+r.arrow+'</span>'+r.name+'<span class="end">ปลายทาง '+esc(r.end)+' ~'+fmtH(r.max)+'</span></div><div class="cb">'+body+tl+'<div class="count">ไปถึงแล้ว '+done+' / '+r.s.length+' จุดในสายนี้</div></div></article>';
  }).join('');
  $('legend').innerHTML=R.map(r=>'<span><i style="background:'+r.c+'"></i>'+r.name+'</span>').join('')+'<span><i style="background:var(--yel);transform:rotate(45deg)"></i>KOKO PLACE</span><span>จุดทึบ = ไปถึงแล้ว</span><span><i style="background:#d93a32;height:4px"></i>ทางหลวง 1 หลัก</span><span><i style="background:#1f5fbf;height:4px"></i>2 หลัก</span><span><i style="background:#3a9a55;height:3px"></i>3 หลัก</span>';
  document.querySelectorAll('.tl').forEach(t=>{const c=t.querySelector('.cur');if(c)t.scrollLeft=c.offsetLeft-t.clientWidth/2+c.offsetWidth/2});
  drawMap();
  try{localStorage.setItem('reachT',T)}catch(e){}
}
function search(){
  const q=$('q').value.trim();
  if(!q){$('res').innerHTML='';return}
  const m=ALL.filter(({s})=>s[0].includes(q)||s[5].includes(q)||s[6]===q||s[6]==='ทล.'+q.replace(/^ทล\.?\s*/,'')).slice(0,8);
  $('res').innerHTML=m.length?m.map(({r,s})=>'<div class="card"><div class="cb">'+hitHTML(s,r,true)+'</div></div>').join(''):'<div class="near">ไม่พบ "'+esc(q)+'" — ลองพิมพ์ชื่อจังหวัดหรือที่เที่ยว</div>';
}
function setT(v){v=Math.round(v*2)/2;if(isNaN(v))return;T=Math.min(17,Math.max(0.5,v));render()}
$('minus').addEventListener('click',()=>setT(T-0.5));
$('plus').addEventListener('click',()=>setT(T+0.5));
$('hrs').addEventListener('change',e=>setT(parseFloat(e.target.value)));
$('pre').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setT(+b.dataset.h)});
$('q').addEventListener('input',search);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowUp'||e.key==='+')setT(T+0.5);if(e.key==='ArrowDown'||e.key==='-')setT(T-0.5)});
const ro=new ResizeObserver(drawMap);ro.observe($('map'));
render();
}
</script>
</body>
</html>
